name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with strict warnings
        run: make clean all

      - name: Run integration tests
        run: make test

      - name: Run sanitizer tests
        run: make clean sanitizer
